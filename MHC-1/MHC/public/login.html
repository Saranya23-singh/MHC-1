<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tranquoria</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e8b57, #4cd964);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            color: white;
        }

        .nav-right a {
            margin-left: 15px;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
        }

        .login-btn {
            border: 1px solid white;
            color: white;
        }

        .signup-btn {
            background: #ff7a18;
            color: white;
        }

        /* MAIN */
        .container {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-around;
            padding: 40px;
        }

        .left {
            color: white;
            max-width: 500px;
        }

        .left h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .left p {
            margin-bottom: 20px;
        }

        .left img {
            width: 100%;
            border-radius: 20px;
        }

        /* LOGIN CARD */
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .login-btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(to right, #2e8b57, #4cd964);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: #ff5e5e;
            color: white;
            cursor: pointer;
        }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        .signup-link {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .signup-link a {
            color: #2e8b57;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>🌿 Tranquoria</h2>
        <div class="nav-right">
            <a href="login.html" class="login-btn">Log In</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">
            <h1>Tranquoria</h1>
            <h3>Start Your Calm Journey Today</h3>
            <p>Your mind deserves a peaceful space to breathe and reflect.</p>
            <img src="LandingPagebg.jpg" alt="Meditation">
        </div>

        <!-- LOGIN CARD -->
        <div class="login-card">
            <h2>Welcome Back</h2>

            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="login-btn-main">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <button type="button" class="reset-btn" onclick="localStorage.clear(); alert('Session reset');">
                    Reset Session
                </button>

                <p style="font-size:12px; margin-top:10px;">
                    Demo: demo@tranquoria.com / demo123
                </p>

                <div class="signup-link">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </div>
            </form>
        </div>

    </div>

    <!-- LOGIN SCRIPT -->
    <script src="login.js"></script>

</body>
</html>
